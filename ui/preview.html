<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#2a3b52;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.preview-banner{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:42px;padding:8px 26px;background:#eef4ff;color:#6480a1;font-size:12px;border-bottom:1px solid #dfe8f6}.preview-banner label{display:flex;align-items:center;gap:8px}.preview-banner select{font:inherit;border:1px solid #d5e1f1;border-radius:5px;padding:3px 6px;background:#fff;color:#5e7798}.course-header{display:flex;align-items:center;justify-content:space-between;height:62px;background:#3c506c;color:#dae2ec;padding:0 30px;font-size:15px}.course-header a{color:inherit;text-decoration:none}.course-header span:last-child{opacity:.65;font-size:12px}.course-layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;height:calc(100vh - 104px)}.course-main{display:flex;flex-direction:column;min-height:0;min-width:0}.course-tabs{display:flex;gap:12px;padding:20px 28px;background:#f5f7fb;flex:0 0 auto}.course-tabs span{padding:6px 16px;background:#eaf0fa;border-radius:20px;color:#8b9ab1;font-size:12px}.course-tabs span:first-child{background:#3e86ff;color:white}.course-main iframe{width:100%;height:100%;flex:1;border:0;background:#f5f7fb;min-height:0}.catalog{border-left:1px solid #e7ecf3;background:#fff;overflow:auto}.catalog-tabs{display:flex;justify-content:space-around;padding:21px 15px 0;color:#7f8ba0;border-bottom:1px solid #edf1f6}.catalog-tabs span{padding:0 5px 13px}.catalog-tabs span:first-child{color:#4b8aff;border-bottom:3px solid #4b8aff}.search{margin:23px 18px;padding:9px 15px;border:1px solid #e7ecf3;color:#b8c1ce;border-radius:25px;font-size:12px}.catalog h2{font-size:13px;padding:14px 19px;background:#f9fafc;margin:0;color:#56657a}.catalog-item{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;font-size:12px;color:#8391a4;border-bottom:1px solid #f8f9fb;gap:10px}.catalog-item b{font-weight:400;color:#55bc9c}.catalog-item.active{background:#f0f5ff;color:#527bad;border-left:3px solid #5a91f4;padding-left:17px}.catalog-item i{display:grid;place-items:center;flex:0 0 19px;height:19px;border-radius:50%;background:#ffc96c;color:#fff;font-size:10px;font-style:normal}.course-footer{font-size:11px;color:#b1bac8;padding:25px 20px}@media(max-width:950px){.course-layout{grid-template-columns:minmax(0,1fr) 245px}.course-header{padding:0 20px}.catalog-item{padding-left:14px;padding-right:14px}}@media(max-width:650px){.catalog{display:none}.course-layout{grid-template-columns:1fr}.preview-banner{padding:8px 15px;align-items:flex-start;font-size:10px}.preview-banner select{max-width:115px}.course-tabs{padding:13px 18px}.course-header{height:50px}.course-layout{height:calc(100vh - 92px)}}</style></head>
